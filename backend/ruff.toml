line-length = 240
target-version = "py312"

# Vendored third-party code is exempt from host lint rules (upstream style).
exclude = ["packages/vimax"]

[lint]
select = ["E", "F", "I", "UP"]
ignore = []

[lint.isort]
known-first-party = ["deerflow", "app"]

[format]
quote-style = "double"
indent-style = "space"
