[project]
name = "vimax"
version = "1.1.0"
description = "Vendored ViMax (autolongvideogeneration, MIT) — character-consistency long-video pipeline; TrainerAI stage-2 VimaxEngine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "moviepy>=2.2.1",
    "scenedetect[opencv]>=0.6.7.1",
    "opencv-python",
    "pillow>=11.3.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.1.2",
    "requests>=2.32.4",
    "aiohttp>=3.12.14",
    "chardet>=5.2.0",
    # langchain / langchain-openai / pydantic are provided by the host
    # (deerflow-harness). faiss-cpu / langchain-community / langchain-text-splitters
    # are deferred to 阶段 4 (novel2movie RAG) — script2video/idea2video don't need them.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vimax"]
