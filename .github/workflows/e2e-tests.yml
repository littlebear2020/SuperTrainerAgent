name: E2E Tests

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      # setup-node 解析 pnpm cache 前需要 pnpm 已在 PATH，故在 corepack 固定版本后启用。
      - name: Enable pnpm dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Read installed Playwright version
        id: playwright-version
        working-directory: frontend
        run: |
          playwright_version="$(node -p 'require("@playwright/test/package.json").version')"
          test -n "${ImageOS:-}"
          echo "version=${playwright_version}" >> "$GITHUB_OUTPUT"
          echo "cache-key=playwright-chromium-${RUNNER_OS}-${ImageOS}-${playwright_version}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-version.outputs.cache-key }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm exec playwright test
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # PR-1 2.5：路由资产预算门禁（上游未进 CI，本地接上即超上游）。
  # 自 build 自测约 +2-3 分钟；--skip-build 共享构建优化列为后续。
  perf-budgets:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      # setup-node 解析 pnpm cache 前需要 pnpm 已在 PATH，故在 corepack 固定版本后启用。
      - name: Enable pnpm dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check route asset budgets
        working-directory: frontend
        run: pnpm perf:check

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: performance-results
          path: frontend/.next/performance-results.json
          retention-days: 7
