<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101F"/>
      <stop offset="0.55" stop-color="#0A1528"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22D3EE" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="1180" cy="190" rx="420" ry="240" fill="url(#glow)"/>
  <ellipse cx="310" cy="830" rx="380" ry="220" fill="#A78BFA" fill-opacity="0.06" filter="url(#soft)"/>

  <g font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="88" y="92" fill="#22D3EE" font-size="13" letter-spacing="5">TRAINER AI · KNOWLEDGE MAP</text>
    <text x="88" y="172" fill="#F8FAFC" font-size="54" font-weight="700">AI Agent 技术栈</text>
    <text x="90" y="212" fill="#94A3B8" font-size="18">从模型能力到业务落地：四层能力与它们之间的连接</text>
    <line x1="88" y1="244" x2="1512" y2="244" stroke="#22D3EE" stroke-opacity="0.18"/>

    <!-- Layered frame -->
    <g>
      <rect x="88" y="286" width="1424" height="600" rx="16" fill="#0B1729" fill-opacity="0.62" stroke="#22D3EE" stroke-opacity="0.14"/>
      <line x1="88" y1="430" x2="1512" y2="430" stroke="#22D3EE" stroke-opacity="0.10" stroke-dasharray="6 8"/>
      <line x1="88" y1="574" x2="1512" y2="574" stroke="#22D3EE" stroke-opacity="0.10" stroke-dasharray="6 8"/>
      <line x1="88" y1="718" x2="1512" y2="718" stroke="#22D3EE" stroke-opacity="0.10" stroke-dasharray="6 8"/>
    </g>

    <!-- Layer labels -->
    <g>
      <text x="122" y="352" fill="#67E8F9" font-size="14" letter-spacing="3">L4</text>
      <text x="160" y="352" fill="#E2E8F0" font-size="21" font-weight="600">应用层</text>
      <text x="122" y="496" fill="#86EFAC" font-size="14" letter-spacing="3">L3</text>
      <text x="160" y="496" fill="#E2E8F0" font-size="21" font-weight="600">编排层</text>
      <text x="122" y="640" fill="#C4B5FD" font-size="14" letter-spacing="3">L2</text>
      <text x="160" y="640" fill="#E2E8F0" font-size="21" font-weight="600">模型层</text>
      <text x="122" y="784" fill="#FCD34D" font-size="14" letter-spacing="3">L1</text>
      <text x="160" y="784" fill="#E2E8F0" font-size="21" font-weight="600">基础设施</text>
    </g>

    <!-- L4 application cards -->
    <g>
      <rect x="300" y="302" width="286" height="96" rx="10" fill="#083344" fill-opacity="0.55" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="326" y="342" fill="#F8FAFC" font-size="21" font-weight="600">课程助手</text>
      <text x="326" y="373" fill="#94A3B8" font-size="13">答疑、陪练、学习路径</text>
      <rect x="608" y="302" width="286" height="96" rx="10" fill="#083344" fill-opacity="0.55" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="634" y="342" fill="#F8FAFC" font-size="21" font-weight="600">内容生产</text>
      <text x="634" y="373" fill="#94A3B8" font-size="13">课程视频、PPT、播客</text>
      <rect x="916" y="302" width="286" height="96" rx="10" fill="#083344" fill-opacity="0.55" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="942" y="342" fill="#F8FAFC" font-size="21" font-weight="600">数据分析</text>
      <text x="942" y="373" fill="#94A3B8" font-size="13">取数、洞察、报告</text>
      <rect x="1224" y="302" width="250" height="96" rx="10" fill="#083344" fill-opacity="0.55" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="1250" y="342" fill="#F8FAFC" font-size="21" font-weight="600">客户服务</text>
      <text x="1250" y="373" fill="#94A3B8" font-size="13">工单、知识库、回访</text>
    </g>

    <!-- L3 orchestration cards -->
    <g>
      <rect x="300" y="448" width="286" height="96" rx="10" fill="#052E2B" fill-opacity="0.55" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="326" y="488" fill="#F8FAFC" font-size="21" font-weight="600">规划</text>
      <text x="326" y="519" fill="#94A3B8" font-size="13">拆解任务、安排步骤</text>
      <rect x="608" y="448" width="286" height="96" rx="10" fill="#052E2B" fill-opacity="0.55" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="634" y="488" fill="#F8FAFC" font-size="21" font-weight="600">工具调用</text>
      <text x="634" y="519" fill="#94A3B8" font-size="13">浏览器、代码、业务系统</text>
      <rect x="916" y="448" width="286" height="96" rx="10" fill="#052E2B" fill-opacity="0.55" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="942" y="488" fill="#F8FAFC" font-size="21" font-weight="600">记忆</text>
      <text x="942" y="519" fill="#94A3B8" font-size="13">会话、任务、长期知识</text>
      <rect x="1224" y="448" width="250" height="96" rx="10" fill="#052E2B" fill-opacity="0.55" stroke="#34D399" stroke-opacity="0.45"/>
      <text x="1250" y="488" fill="#F8FAFC" font-size="21" font-weight="600">多智能体</text>
      <text x="1250" y="519" fill="#94A3B8" font-size="13">分工、协作、复核</text>
    </g>

    <!-- L2 model cards -->
    <g>
      <rect x="300" y="592" width="286" height="96" rx="10" fill="#1E1B4B" fill-opacity="0.6" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="326" y="632" fill="#F8FAFC" font-size="21" font-weight="600">通用大模型</text>
      <text x="326" y="663" fill="#94A3B8" font-size="13">语言、推理、代码</text>
      <rect x="608" y="592" width="286" height="96" rx="10" fill="#1E1B4B" fill-opacity="0.6" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="634" y="632" fill="#F8FAFC" font-size="21" font-weight="600">领域模型</text>
      <text x="634" y="663" fill="#94A3B8" font-size="13">行业知识、专项任务</text>
      <rect x="916" y="592" width="286" height="96" rx="10" fill="#1E1B4B" fill-opacity="0.6" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="942" y="632" fill="#F8FAFC" font-size="21" font-weight="600">多模态</text>
      <text x="942" y="663" fill="#94A3B8" font-size="13">图像、语音、视频</text>
      <rect x="1224" y="592" width="250" height="96" rx="10" fill="#1E1B4B" fill-opacity="0.6" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="1250" y="632" fill="#F8FAFC" font-size="21" font-weight="600">推理优化</text>
      <text x="1250" y="663" fill="#94A3B8" font-size="13">延迟、成本、吞吐</text>
    </g>

    <!-- L1 infrastructure cards -->
    <g>
      <rect x="300" y="736" width="286" height="96" rx="10" fill="#2A1E07" fill-opacity="0.55" stroke="#FBBF24" stroke-opacity="0.42"/>
      <text x="326" y="776" fill="#F8FAFC" font-size="21" font-weight="600">算力</text>
      <text x="326" y="807" fill="#94A3B8" font-size="13">训练、推理、调度</text>
      <rect x="608" y="736" width="286" height="96" rx="10" fill="#2A1E07" fill-opacity="0.55" stroke="#FBBF24" stroke-opacity="0.42"/>
      <text x="634" y="776" fill="#F8FAFC" font-size="21" font-weight="600">向量库</text>
      <text x="634" y="807" fill="#94A3B8" font-size="13">检索、索引、召回</text>
      <rect x="916" y="736" width="286" height="96" rx="10" fill="#2A1E07" fill-opacity="0.55" stroke="#FBBF24" stroke-opacity="0.42"/>
      <text x="942" y="776" fill="#F8FAFC" font-size="21" font-weight="600">评测</text>
      <text x="942" y="807" fill="#94A3B8" font-size="13">基准、回归、人工复核</text>
      <rect x="1224" y="736" width="250" height="96" rx="10" fill="#2A1E07" fill-opacity="0.55" stroke="#FBBF24" stroke-opacity="0.42"/>
      <text x="1250" y="776" fill="#F8FAFC" font-size="21" font-weight="600">安全与权限</text>
      <text x="1250" y="807" fill="#94A3B8" font-size="13">鉴权、审计、隔离</text>
    </g>

    <!-- Vertical connectors between layers -->
    <g stroke="#22D3EE" stroke-opacity="0.35" stroke-dasharray="4 6">
      <line x1="443" y1="398" x2="443" y2="448"/>
      <line x1="751" y1="398" x2="751" y2="448"/>
      <line x1="1059" y1="398" x2="1059" y2="448"/>
      <line x1="1349" y1="398" x2="1349" y2="448"/>
      <line x1="443" y1="544" x2="443" y2="592"/>
      <line x1="751" y1="544" x2="751" y2="592"/>
      <line x1="1059" y1="544" x2="1059" y2="592"/>
      <line x1="1349" y1="544" x2="1349" y2="592"/>
      <line x1="443" y1="688" x2="443" y2="736"/>
      <line x1="751" y1="688" x2="751" y2="736"/>
      <line x1="1059" y1="688" x2="1059" y2="736"/>
      <line x1="1349" y1="688" x2="1349" y2="736"/>
    </g>

    <!-- Side annotation -->
    <g>
      <line x1="88" y1="908" x2="1512" y2="908" stroke="#22D3EE" stroke-opacity="0.18"/>
      <circle cx="102" cy="944" r="4" fill="#22D3EE"/>
      <text x="120" y="949" fill="#94A3B8" font-size="14">每一层都可以被替换或单独评测；真正决定体验的，是层与层之间的连接。</text>
      <text x="1512" y="949" fill="#64748B" font-size="12" text-anchor="end" letter-spacing="2">AI AGENT STACK · 2026</text>
    </g>
  </g>
</svg>
