<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A5F" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1E3A5F" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F" fill-opacity="0.7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C" fill-opacity="0.75"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#F6F1E7"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="26" y="26" width="1548" height="948" fill="none" stroke="#1E3A5F" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="42" y="42" width="1516" height="916" fill="none" stroke="#1E3A5F" stroke-opacity="0.16" stroke-width="1"/>

  <g font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
    <text x="88" y="104" fill="#1E3A5F" font-size="13" letter-spacing="5">TRAINER AI · SYSTEM BLUEPRINT</text>
    <text x="86" y="178" fill="#12263D" font-size="58" font-weight="700">RAG 系统架构</text>
    <text x="90" y="220" fill="#52657A" font-size="18">从文档到答案：一条可检索、可引用、可评估的链路</text>
    <line x1="88" y1="254" x2="1512" y2="254" stroke="#1E3A5F" stroke-opacity="0.3"/>

    <!-- flow -->
    <g>
      <rect x="88" y="322" width="210" height="132" fill="#FBF7EE" stroke="#1E3A5F" stroke-opacity="0.55" stroke-width="1.6"/>
      <text x="110" y="360" fill="#C2410C" font-size="12" font-weight="700" letter-spacing="2">01</text>
      <text x="110" y="398" fill="#12263D" font-size="25" font-weight="700">文档源</text>
      <text x="110" y="428" fill="#52657A" font-size="14">PDF · DOCX · 网页 · FAQ</text>

      <rect x="348" y="322" width="210" height="132" fill="#FBF7EE" stroke="#1E3A5F" stroke-opacity="0.55" stroke-width="1.6"/>
      <text x="370" y="360" fill="#C2410C" font-size="12" font-weight="700" letter-spacing="2">02</text>
      <text x="370" y="398" fill="#12263D" font-size="25" font-weight="700">解析与切分</text>
      <text x="370" y="428" fill="#52657A" font-size="14">结构识别 · 语义分块</text>

      <rect x="608" y="322" width="210" height="132" fill="#FBF7EE" stroke="#1E3A5F" stroke-opacity="0.55" stroke-width="1.6"/>
      <text x="630" y="360" fill="#C2410C" font-size="12" font-weight="700" letter-spacing="2">03</text>
      <text x="630" y="398" fill="#12263D" font-size="25" font-weight="700">向量库</text>
      <text x="630" y="428" fill="#52657A" font-size="14">索引 · 元数据 · 权限</text>

      <rect x="868" y="322" width="210" height="132" fill="#FBF7EE" stroke="#1E3A5F" stroke-opacity="0.55" stroke-width="1.6"/>
      <text x="890" y="360" fill="#C2410C" font-size="12" font-weight="700" letter-spacing="2">04</text>
      <text x="890" y="398" fill="#12263D" font-size="25" font-weight="700">检索器</text>
      <text x="890" y="428" fill="#52657A" font-size="14">召回 · 重排 · 过滤</text>

      <rect x="1128" y="322" width="190" height="132" fill="#FBF7EE" stroke="#1E3A5F" stroke-opacity="0.55" stroke-width="1.6"/>
      <text x="1150" y="360" fill="#C2410C" font-size="12" font-weight="700" letter-spacing="2">05</text>
      <text x="1150" y="398" fill="#12263D" font-size="25" font-weight="700">生成模型</text>
      <text x="1150" y="428" fill="#52657A" font-size="14">组织回答 · 引用来源</text>

      <rect x="1348" y="322" width="164" height="132" fill="#F3E7D6" stroke="#C2410C" stroke-opacity="0.55" stroke-width="1.6"/>
      <text x="1368" y="360" fill="#C2410C" font-size="12" font-weight="700" letter-spacing="2">06</text>
      <text x="1368" y="398" fill="#12263D" font-size="24" font-weight="700">答案与引用</text>
      <text x="1368" y="428" fill="#52657A" font-size="13">可追溯 · 可复核</text>
    </g>
    <g stroke="#1E3A5F" stroke-opacity="0.6" stroke-width="2">
      <line x1="300" y1="388" x2="338" y2="388" marker-end="url(#arrow)"/>
      <line x1="560" y1="388" x2="598" y2="388" marker-end="url(#arrow)"/>
      <line x1="820" y1="388" x2="858" y2="388" marker-end="url(#arrow)"/>
      <line x1="1080" y1="388" x2="1118" y2="388" marker-end="url(#arrow)"/>
      <line x1="1320" y1="388" x2="1338" y2="388" marker-end="url(#arrow)"/>
    </g>

    <!-- evaluation band -->
    <g>
      <rect x="88" y="592" width="1424" height="190" fill="#FBF7EE" fill-opacity="0.7" stroke="#1E3A5F" stroke-opacity="0.3" stroke-width="1.4"/>
      <text x="114" y="632" fill="#1E3A5F" font-size="12" letter-spacing="3">EVALUATION LAYER</text>
      <text x="114" y="672" fill="#12263D" font-size="26" font-weight="700">评估与观测</text>
      <text x="114" y="706" fill="#52657A" font-size="14">每次检索和生成都留下记录；没有评估，就没有可复用的 RAG。</text>

      <g>
        <rect x="640" y="620" width="190" height="70" fill="#F6F1E7" stroke="#1E3A5F" stroke-opacity="0.4"/>
        <text x="662" y="650" fill="#1E3A5F" font-size="15" font-weight="600">召回质量</text>
        <text x="662" y="674" fill="#52657A" font-size="12">相关内容有没有被找到</text>

        <rect x="852" y="620" width="190" height="70" fill="#F6F1E7" stroke="#1E3A5F" stroke-opacity="0.4"/>
        <text x="874" y="650" fill="#1E3A5F" font-size="15" font-weight="600">引用准确</text>
        <text x="874" y="674" fill="#52657A" font-size="12">结论能不能对上原文</text>

        <rect x="1064" y="620" width="190" height="70" fill="#F6F1E7" stroke="#1E3A5F" stroke-opacity="0.4"/>
        <text x="1086" y="650" fill="#1E3A5F" font-size="15" font-weight="600">延迟与成本</text>
        <text x="1086" y="674" fill="#52657A" font-size="12">一次回答的代价</text>

        <rect x="1276" y="620" width="206" height="70" fill="#F6F1E7" stroke="#1E3A5F" stroke-opacity="0.4"/>
        <text x="1298" y="650" fill="#1E3A5F" font-size="15" font-weight="600">权限与审计</text>
        <text x="1298" y="674" fill="#52657A" font-size="12">谁看过、谁改过、谁负责</text>
      </g>

      <line x1="973" y1="592" x2="973" y2="470" stroke="#C2410C" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowOrange)"/>
      <line x1="1169" y1="592" x2="1169" y2="470" stroke="#C2410C" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowOrange)"/>
      <text x="1004" y="536" fill="#C2410C" font-size="12">观测数据回流</text>
    </g>

    <!-- bottom note -->
    <g>
      <line x1="88" y1="846" x2="1512" y2="846" stroke="#1E3A5F" stroke-opacity="0.25"/>
      <text x="90" y="888" fill="#52657A" font-size="14">关键不在“接了向量库”，而在“检索到的内容值得被引用、引用之后还能被评估”。</text>
      <text x="1512" y="888" fill="#8A7A63" font-size="11" text-anchor="end" letter-spacing="2">RAG ARCHITECTURE · 2026</text>
      <g fill="none" stroke="#1E3A5F" stroke-opacity="0.35">
        <path d="M 88 920 h 40 M 88 920 v 20 M 1472 940 h 40 M 1512 920 v 20"/>
      </g>
    </g>
  </g>
</svg>
