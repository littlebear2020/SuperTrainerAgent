events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
http {
    # Basic settings
    # SEC-M9: hide nginx version in headers/error pages
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Docker internal DNS (for resolving k3s hostname)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream servers (using Docker service names)
    # NOTE: `zone` and `resolve` are nginx Plus-only features and are not
    # available in the standard nginx:alpine image. Docker's internal DNS
    # (127.0.0.11) handles service discovery; upstreams are resolved at
    # nginx startup and remain valid for the lifetime of the deployment.
    upstream gateway {
        server gateway:8001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ── Main server (path-based routing) ─────────────────────────────────
    server {
        # C8（2026-10-05 审计 §1-7）：server 级兜底剥离内部信任头
        proxy_set_header X-DeerFlow-Internal-Token "";
        proxy_set_header X-DeerFlow-Internal-User-Id "";
        listen 2026 default_server;
        listen [::]:2026 default_server;
        server_name _;

        # ── Host header: use $http_host, NOT $host ─────────────────────────
        # nginx's `$host` strips the port (e.g. `company-server:2026` →
        # `company-server`). The Gateway's CSRF middleware compares the
        # browser's `Origin` (always carries the port) against the host it
        # reconstructs from this header, so a port-stripped Host makes every
        # auth POST (login/register/initialize) fail with
        # `403 Cross-site auth request denied.` on any non-default port.
        # `$http_host` is the browser's raw Host header, port intact, so the
        # Gateway sees exactly what the browser targeted.
        # (TLS-terminating LB in front? Also pass `$http_x_forwarded_proto`
        # for X-Forwarded-Proto, or the same mismatch hits the scheme.)

        # Hide CORS headers from upstream to prevent duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # CORS headers for all responses (nginx handles CORS centrally)

        # ── Security response headers (SEC-M11, 2026-09-04) ─────────────────
        # All server-level: no location below defines its own add_header, so
        # these inherit everywhere (a location-level add_header would cancel
        # inheritance — keep that invariant when editing).
        # X-Frame-Options MUST stay SAMEORIGIN (never DENY): artifact previews
        # load /api/threads/{id}/artifacts/... in same-origin iframes.
        # Deliberately no CSP here — needs per-page tuning, out of scope.
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'SAMEORIGIN' always;
        add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
        add_header 'X-Permitted-Cross-Domain-Policies' 'none' always;

        # Handle OPTIONS requests (CORS preflight)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Uploads endpoint
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large file upload support (2GB + multipart/form-data overhead)
            client_max_body_size 2200M;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 600s;
            client_body_timeout 3600s;
        }

        # Custom API: Artifact serving — rewrite Google Fonts to Chinese mirror
        location ~ ^/api/threads/[^/]+/artifacts/ {
            proxy_pass http://gateway;
            # 大文件/慢盘场景默认 60s 读超时会被掐断（与 catch-all /api/ 的 300s 对齐）
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent upstream gzip so sub_filter can inspect the body
            proxy_set_header Accept-Encoding "";

            # Rewrite Google Fonts CDN → Chinese mirror (fonts.loli.net)
            sub_filter 'fonts.googleapis.com' 'fonts.loli.net';
            sub_filter 'fonts.gstatic.com' 'gstatic.loli.net';
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            proxy_pass http://gateway;
            # suggestions 等端点同步调 LLM 可超 60s（默认读超时）→ 504；
            # 正则 location 优先于 catch-all /api/（其 300s 对此不生效），须在此显式设
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Documentation locations (/docs, /redoc, /openapi.json) removed
        # (SEC-M11, 2026-09-04). NOTE: the app-layer docs switch is ON by
        # default (app/gateway/config.py:27, GATEWAY_ENABLE_DOCS=true) —
        # removing the nginx routes is defense in depth that keeps the API
        # surface unexposed at the proxy layer regardless of the app setting;
        # set GATEWAY_ENABLE_DOCS=false to also close it in-app.

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Provisioner location (/api/sandboxes) removed (SEC-C6/SEC-M11,
        # 2026-09-04): provisioner is not deployed in either environment and
        # has no token auth — the gateway reaches it by container name, not
        # through nginx. If provisioner is ever enabled, re-add this location
        # only AFTER adding token auth (plan appendix A).

        # Custom API: Voice Twin endpoint (audio uploads up to 10MB)
        location /api/voice-twins/production {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300s;
        }

        location /api/voice-twins {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 15M;
            proxy_read_timeout 120s;
        }

        # SSE: video-gen task events 长连接 —— 关缓冲 + 1h 超时（对齐 /api/langgraph/）。
        # 此前走 /api/ 通配块：proxy_buffering 未关 + 300s 超时 → SSE 被缓冲/掐断，
        # 前端 EventSource 无退避重连刷屏（ERR_CONNECTION_TIMED_OUT ×20）。
        location ~ ^/api/video/tasks/[^/]+/events$ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Script extract uploads (2026-09-12 defects batch item 18): docx with
        # embedded images up to 200MB at the gateway (SCRIPT_UPLOAD_MAX_BYTES).
        # nginx allows 210M so the gateway's own readable 413 wins over nginx's
        # catch-all 50M (exact-match location takes precedence over /api/).
        location = /api/video/script/extract {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 210M;
            proxy_read_timeout 300s;
        }

        # PPT template uploads (2026-09-12 defects batch item 21): up to 100MB at
        # the gateway (MAX_PPTX_BYTES). Same pattern as above: 110M here so the
        # gateway's 413 with a readable message wins over the catch-all 50M.
        location = /api/assets/ppt-templates {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 110M;
            proxy_read_timeout 300s;
        }

        # Catch-all for /api/ routes not covered above (e.g. /api/v1/auth/*).
        # More specific prefix and regex locations above still take precedence.
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # E2: catch-all /api/ 无 proxy_read_timeout（默认 60s）→ seedream/preview >60s 即 504
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Allow up to 50MB for video-gen BGM uploads and similar API uploads.
            client_max_body_size 50M;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            # C8（2026-10-05 审计 §1-7）：入站剥离内部信任头（防外部直连伪造）
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
