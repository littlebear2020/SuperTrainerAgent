events {
    worker_connections 1024;
}
pid logs/nginx.pid;
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log logs/nginx-access.log;
    error_log logs/nginx-error.log;

    # Upstream servers (using 127.0.0.1 for local development)
    upstream gateway {
        server 127.0.0.1:8001;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        # C7（2026-10-05 审计 §12-4）：安全响应头对齐生产版（nginx.conf）
        server_tokens off;
        # 评审修复轮（Important #4）：server 级兜底剥离内部信任头（自定义了
        # proxy_set_header 的 location 会取消继承，逐 location 补齐不如 server 级兜底+关键 location 显式）
        proxy_set_header X-DeerFlow-Internal-Token "";
        proxy_set_header X-DeerFlow-Internal-User-Id "";
        add_header 'X-Content-Type-Options' 'nosniff' always;
        # X-Frame-Options 保持 SAMEORIGIN（artifact 预览需同源 iframe；DENY 会杀预览）
        add_header 'X-Frame-Options' 'SAMEORIGIN' always;
        add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
        add_header 'X-Permitted-Cross-Domain-Policies' 'none' always;
        listen 2026;
        listen [::]:2026;
        server_name _;

        # Hide CORS headers from upstream to prevent duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # CORS headers for all responses (nginx handles CORS centrally)

        # Handle OPTIONS requests (CORS preflight)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;

            # Headers
            # C7（2026-10-05 审计 §12-4）：$http_host 保留端口（生产版既修——$host 剥端口致 CSRF 403）
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Uploads endpoint
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large file upload support (2GB + multipart/form-data overhead)
            client_max_body_size 2200M;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 600s;
            client_body_timeout 3600s;
        }

        # Custom API: Artifact serving — rewrite Google Fonts to Chinese mirror
        location ~ ^/api/threads/[^/]+/artifacts/ {
            proxy_pass http://gateway;
            # 大文件/慢盘场景默认 60s 读超时会被掐断（与 catch-all /api/ 的 300s 对齐）
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent upstream gzip so sub_filter can inspect the body
            proxy_set_header Accept-Encoding "";

            # Rewrite Google Fonts CDN → Chinese mirror (fonts.loli.net)
            sub_filter 'fonts.googleapis.com' 'fonts.loli.net';
            sub_filter 'fonts.gstatic.com' 'gstatic.loli.net';
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            proxy_pass http://gateway;
            # suggestions 等端点同步调 LLM 可超 60s（默认读超时）→ 504；
            # 正则 location 优先于 catch-all /api/（其 300s 对此不生效），须在此显式设
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # C7（2026-10-05 审计 §12-4）：大上传两个精确 location（生产版口径）——
        # nginx 档略高于 gateway，让 gateway 的可读 413 胜过 nginx 兜底 50M。
        location = /api/video/script/extract {
            client_max_body_size 210M;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/assets/ppt-templates {
            client_max_body_size 110M;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom API: Voice Twin endpoint (audio uploads up to 10MB)
        location /api/voice-twins/production {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300s;
        }

        location /api/voice-twins {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 15M;
            proxy_read_timeout 120s;
        }

        # Catch-all for any /api/* prefix not matched by a more specific block above.
        # SSE: video-gen task events 长连接 —— 关缓冲 + 1h 超时（对齐 /api/langgraph/）。
        # 此前走 /api/ 通配块：proxy_buffering 未关 + 300s 超时 → SSE 被缓冲/掐断，
        # 前端 EventSource 无退避重连刷屏（ERR_CONNECTION_TIMED_OUT ×20）。
        location ~ ^/api/video/tasks/[^/]+/events$ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Covers the auth module (/api/v1/auth/login, /me, /change-password, ...),
        # plus feedback / runs / token-usage routes that 2.0-rc added without
        # updating this nginx config. Longest-prefix matching ensures the explicit
        # blocks above (/api/models, /api/threads regex, /api/langgraph/, ...) still
        # win for their paths — only truly unmatched /api/* requests land here.
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Auth endpoints set HttpOnly cookies — make sure nginx doesn't
            # strip the Set-Cookie header from upstream responses.
            proxy_pass_header Set-Cookie;

            # E2: catch-all /api/ 无 proxy_read_timeout（默认 60s）→ seedream/preview >60s 即 504
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Allow up to 50MB for video-gen BGM uploads and similar API uploads.
            client_max_body_size 50M;
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-DeerFlow-Internal-Token "";
            proxy_set_header X-DeerFlow-Internal-User-Id "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Disable response buffering for the frontend. Without this,
            # nginx tries to spool large upstream responses (e.g. Next.js
            # static chunks) into ``proxy_temp_path``, which defaults to
            # the system-owned ``/var/lib/nginx/proxy`` and fails with
            # ``[crit] open() ... failed (13: Permission denied)`` when
            # nginx is launched as a non-root user (every dev machine
            # except production root containers). The symptom on the
            # client side is ``ERR_INCOMPLETE_CHUNKED_ENCODING`` and
            # ``ChunkLoadError`` partway through page hydration.
            #
            # Streaming the response straight through avoids the
            # temp-file path entirely. The frontend already sets its
            # own cache headers, so we don't lose anything from
            # disabling nginx-side buffering.
            proxy_buffering off;
            proxy_request_buffering off;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
