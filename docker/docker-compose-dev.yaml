# DeerFlow Development Environment
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: Reverse proxy (port 2026)
#   - frontend: Frontend Next.js dev server (port 3000)
#   - gateway: Backend Gateway API + agent runtime (port 8001)
#   - provisioner (optional): Sandbox provisioner (creates Pods in host Kubernetes)
#
# Prerequisites:
#   - Kubernetes cluster + kubeconfig are only required when using provisioner mode.
#
# Access: http://localhost:2026

services:
  # ── Sandbox Provisioner ────────────────────────────────────────────────
  # Manages per-sandbox Pod + Service lifecycle in the host Kubernetes
  # cluster via the K8s API.
  # Backend accesses sandboxes directly via host.docker.internal:{NodePort}.
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - TZ=Asia/Shanghai
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      # Host paths for K8s HostPath volumes (must be absolute paths accessible by K8s node)
      # On Docker Desktop/OrbStack, use your actual host paths like /Users/username/...
      # Set these in your shell before running docker-compose:
      #   export DEER_FLOW_ROOT=/absolute/path/to/deer-flow
      - SKILLS_HOST_PATH=${DEER_FLOW_ROOT}/skills
      - THREADS_HOST_PATH=${DEER_FLOW_ROOT}/backend/.deer-flow/threads
      # Production: use PVC instead of hostPath to avoid data loss on node failure.
      # When set, hostPath vars above are ignored for the corresponding volume.
      # USERDATA_PVC_NAME uses subPath (threads/{thread_id}/user-data) automatically.
      # - SKILLS_PVC_NAME=deer-flow-skills-pvc
      # - USERDATA_PVC_NAME=deer-flow-userdata-pvc
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      # Override K8S API server URL since kubeconfig uses 127.0.0.1
      # which is unreachable from inside the container
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── PPT Converter Sidecar ──────────────────────────────────────────────
  # LibreOffice + poppler in a separate container (~600MB-1GB).
  # Keeps Gateway image lean. Optional — Gateway falls back to sidecar
  # when local LibreOffice is not available.
  ppt-converter:
    build:
      context: ../
      dockerfile: docker/ppt-converter/Dockerfile
    container_name: deer-flow-ppt-converter
    environment:
      - TZ=Asia/Shanghai
      - PPT_CONVERTER_SECRET=${PPT_CONVERTER_SECRET:?PPT_CONVERTER_SECRET must be set (generate via deploy script or .env)}
    networks:
      - deer-flow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  # Routes API traffic to gateway and (optionally) provisioner.
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Frontend - Next.js Development Server
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # Mount pnpm store for caching
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Backend - Gateway API
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: deer-flow-gateway
    command: sh -c "{ cd backend && (uv sync || (echo '[startup] uv sync failed; recreating .venv and retrying once' && uv venv --allow-existing .venv && uv sync)) && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include='*.yaml .env'; } > /app/logs/gateway.log 2>&1"
    volumes:
      - ../backend/:/app/backend/
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills/public:/app/skills/public:ro
      - ../skills/custom:/app/skills/custom
      - ../logs:/app/logs
      # Use a Docker-managed uv cache volume instead of a host bind mount.
      # On macOS/Docker Desktop, uv may fail to create symlinks inside shared
      # host directories, which causes startup-time `uv sync` to crash.
      - gateway-uv-cache:/root/.cache/uv
      # DooD: AioSandboxProvider runs inside the Gateway process.
      - /var/run/docker.sock:/var/run/docker.sock
      # D-3（2026-10-05 审计 §4-5）：CLI 凭据目录默认不挂载（config 未启用 acp_agents，
      # 摘除零成本且消除宿主凭据暴露面）。需要 ACP/CLI 沙箱时取消下述注释：
#       # CLI auth directories for auto-auth (Claude Code + Codex CLI)
#       - type: bind
#         source: ${HOME:?HOME must be set}/.claude
#         target: /root/.claude
#         read_only: true
#         bind:
#           create_host_path: true
#       - type: bind
#         source: ${HOME:?HOME must be set}/.codex
#         target: /root/.codex
#         read_only: true
#         bind:
#           create_host_path: true
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - PPT_CONVERTER_URL=http://ppt-converter:8030
      - PPT_CONVERTER_SECRET=${PPT_CONVERTER_SECRET:?PPT_CONVERTER_SECRET must be set (generate via deploy script or .env)}
      - AUTH_TRUSTED_PROXIES=172.0.0.0/8
      # NEW-3: gateway 探 worker 能力的地址。缺它会回落 localhost:8040 ——
      # gateway 容器自身没人监听 8040（worker 是独立容器），探测必败 →
      # caps=["v1"] → v2_mixed/v3_segmented 在生产完全不可达。
      - WORKER_HEALTH_URL=${WORKER_HEALTH_URL:-http://production-worker:8040}
      - GATEWAY_ENABLE_DOCS=true  # C8：默认翻转后 dev 显式开
    env_file:
      - ../.env
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g

  # ── Production Worker ──────────────────────────────────────────────────
  # ffmpeg video composition in an isolated container.
  # Polls SQLite DB for composing tasks, runs ffmpeg pipeline.
  production-worker:
    build:
      context: ./production-worker
      dockerfile: Dockerfile
    container_name: deer-flow-production-worker
    # 同 deploy 公式：drain 每线程顺序 join 120s，dev 不设 MAX_CONCURRENT_TASKS
    # （worker.py 默认 2 槽）→ 2×120+60 = 300s。修前 150s < 240s 最坏 drain，
    # dev 拓扑上一直保留着「SIGKILL 先于 release_my_leases」病灶。
    stop_grace_period: 300s
    environment:
      - TZ=Asia/Shanghai
      # WORKER_ID 已删（审计 §12-6）：worker.py 读 HOSTNAME，静态赋值是死配置
      # T3 双池：ffmpeg 池显式声明（认领谓词=registry 派生白名单扣除 remotion 类型）
      - WORKER_POOL=ffmpeg
      - DB_PATH=/app/data/deerflow.db
      - STORAGE_DIR=/app/backend/.deer-flow/voice-twins
      - POLL_INTERVAL=2
      - LEASE_DURATION=1800
    volumes:
      - ../backend/.deer-flow/voice-twins:/app/backend/.deer-flow/voice-twins
      # Shared DB file (SQLite)
      - ../backend/.deer-flow/data:/app/data
    ports:
      - "127.0.0.1:8040:8040"  # C7：worker 管理端口只绑回环（原 0.0.0.0）
    networks:
      - deer-flow-dev
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8040/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Remotion 渲染池（T3；dev/本机 32G 缩减档——生产 10g+2g shm 见 deploy）──
  remotion-worker:
    # T-G1（R24）：init=true 收割孙进程——渲染超时 subprocess 只杀 npx，
    # Chrome headless 孤儿进程会耗尽内存
    init: true
    build:
      # ⚠️ 上下文必须是仓库根（COPY video-templates/course-standard）
      context: ..
      dockerfile: docker/production-worker/Dockerfile.remotion
    # Chrome headless shell 预下载缓存只有 linux/amd64（CfT 不发布 linux-arm64）；
    # Apple Silicon 本机走 Rosetta 模拟 amd64（与生产镜像完全同构，冒烟速度可接受）
    platform: linux/amd64
    container_name: deer-flow-remotion-worker
    # 1 渲染槽 + 1 still 槽 → 2×120+60 = 300s（同 deploy 公式）
    stop_grace_period: 300s
    shm_size: 2g
    environment:
      - TZ=Asia/Shanghai
      # WORKER_ID 已删（审计 §12-6）：同上
      - WORKER_POOL=remotion
      - DB_PATH=/app/data/deerflow.db
      - STORAGE_DIR=/app/backend/.deer-flow/voice-twins
      - VIDEO_GEN_STORAGE_DIR=/app/backend/.deer-flow/video-gen
      - POLL_INTERVAL=2
      - LEASE_DURATION=1800
      - MAX_CONCURRENT_TASKS=1
      - REMOTION_STILL_SLOTS=1
    volumes:
      - ../backend/.deer-flow/voice-twins:/app/backend/.deer-flow/voice-twins
      - ../backend/.deer-flow/video-gen:/app/backend/.deer-flow/video-gen
      - ../backend/.deer-flow/data:/app/data
    ports:
      - "127.0.0.1:8041:8040"  # C7：同上
    networks:
      - deer-flow-dev
    restart: unless-stopped
    # 本机 32G 功能验证缩减档（生产 10g/128G 基准，D18）
    mem_limit: 6g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8040/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Persist .venv across container restarts so dependencies installed during
  # image build are not shadowed by the host backend/ directory mount.
  gateway-venv:
  gateway-uv-cache:

networks:
  deer-flow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
