#     # stored encrypted per user). A globally enabled feishu entry here AND a
#     # personal instance cannot coexist — the user_registry guard refuses the
#     # personal one with a skip explanation. Keep global entries disabled if
#     # you need the template at all.
#     enabled: false
#     app_id: $FEISHU_APP_ID
#     app_secret: $FEISHU_APP_SECRET
#     # domain: https://open.feishu.cn       # China (default)
