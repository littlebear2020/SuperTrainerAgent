# ============================================================================
# Guardrails Configuration
# ============================================================================
# Optional pre-execution authorization for tool calls.
# When enabled, every tool call passes through the configured provider
# before execution. Three options: built-in allowlist, OAP policy provider,
# or custom provider. See backend/docs/GUARDRAILS.md for full documentation.
#
# Providers are loaded by class path via resolve_variable (same as models/tools).

# --- Option 1: Built-in AllowlistProvider (zero external deps) ---
# guardrails:
#   enabled: true
#   provider:
#     use: deerflow.guardrails.builtin:AllowlistProvider
#     config:
#       denied_tools: ["bash", "write_file"]

# --- Option 2: OAP passport provider (open standard, any implementation) ---
#   The Open Agent Passport (OAP) spec defines passport format and decision codes.
#   Any OAP-compliant provider works. Example using APort (reference implementation):
#     pip install aport-agent-guardrails && aport setup --framework deerflow
# guardrails:
#   enabled: true
#   provider:
#     use: aport_guardrails.providers.generic:OAPGuardrailProvider

# --- Option 3: Custom provider (any class with evaluate/aevaluate methods) ---
# guardrails:
#   enabled: true
#   provider:
#     use: my_package:MyGuardrailProvider
#     config:
#       key: value

# ============================================================================
# Circuit Breaker Configuration
# ============================================================================
# Circuit breaker for LLM calls prevents repeated requests to a failing provider.
# When the failure threshold is reached, subsequent calls fast-fail until recovery.
#
# This is useful for:
# - Avoiding rate-limit bans during provider outages
# - Reducing resource exhaustion from retry loops
# - Gracefully degrading when LLM services are unavailable

# circuit_breaker:
#   # Number of consecutive failures before opening the circuit (default: 5)
#   failure_threshold: 5
#   # Time in seconds before attempting to recover (default: 60)
#   recovery_timeout_sec: 60

# ============================================================================
# Gallery Configuration (Skill Inspiration Library & UGC Ecosystem)
# ============================================================================
gallery:
  # Master switch for the inspiration gallery UI (browsing official cases).
  enabled: true
  # Independent switch for community sharing (UGC submission + likes).
  # Set false during content moderation while keeping the gallery read-only.
  ugc_enabled: true
  # OPS NOTE: UGC writes (ugc-cases.json / likes.json) use an in-process asyncio.Lock,
  # safe only under a SINGLE worker process. Multi-worker / multi-process deployments
  # will lose concurrent writes — migrate UGC storage to a DB or cross-process file
  # lock before scaling horizontally. See docs/changelog-2026-06-30-gallery-optimization.md.

# ============================================================================
# Voice Clone Configuration (Volcengine Mega TTS)
# ============================================================================
# Lecturer voice cloning: upload audio → train clone → synthesize text with
# the cloned voice. Requires a Volcengine account with Mega TTS enabled.
#
# Prerequisites:
#   - ffmpeg installed on host (macOS: brew install ffmpeg)
#   - Volcengine appid + token from console
#
# voice_clone:
#   enabled: false
#   appid: $VOLCENGINE_VOICE_APPID
#   token: $VOLCENGINE_VOICE_TOKEN
#   access_key: $VOLCENGINE_VOICE_ACCESS_KEY
#   domain: https://openspeech.bytedance.com
#   # （2026-08-09 B2：default_model_type 死配置已删除——默认模型五方统一为 5=ICL 3.0，
#   #  用户在前端克隆面板自选 1-5）
#   default_language: 0          # 0=Chinese
#   max_upload_bytes: 10485760   # 10MB max audio file (matches Volcengine API limit)
#   min_duration_seconds: 30     # Minimum audio duration
#   training_timeout_minutes: 30          # 克隆训练超时（分钟），超时未就绪标 failed
#   training_reaper_interval_minutes: 5   # 训练行巡检间隔（分钟），0=关闭 reaper
#   status_query_timeout: 30.0            # 训练状态查询 HTTP 超时（秒）
#   storage_dir: .deer-flow/voice-twins  # Local storage for audio files
#   qihu_tts:
#     api_key: $QIHU_API_KEY        # 360 TTS API key (shared with Qihu image/video providers)
#     enabled: true                  # Enable 360 TTS preset voices
#   edge_tts:
#     enabled: true                  # edge-tts 免费音色 + 降级链末端兜底（默认开，服务器实测可达）
#     timeout: 60.0                  # edge-tts 流式超时（秒）

