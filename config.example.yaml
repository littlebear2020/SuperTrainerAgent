# Configuration for the DeerFlow application
#
# Guidelines:
# - Copy this file to `config.yaml` and customize it for your environment
# - The default path of this configuration file is `config.yaml` in the current working directory.
#   However you can change it using the `DEER_FLOW_CONFIG_PATH` environment variable.
# - Environment variables are available for all field values. Example: `api_key: $OPENAI_API_KEY`
# - The `use` path is a string that looks like "package_name.sub_package_name.module_name:class_name/variable_name".

# ============================================================================
# Config Version (used to detect outdated config files)
# ============================================================================
# Bump this number when the config schema changes.
# Run `make config-upgrade` to merge new fields into your local config.yaml.
config_version: 29

# ============================================================================
# Run Recursion Budget
# ============================================================================
# Hard server-side ceiling for a client-supplied run recursion_limit.
# Client values above this are clamped (2026-08-13 regression fix: the
# frontend sends 2500, so 2500 is the effective web default; IM channels keep
# the server default of 100). Prevents runaway LangGraph super-steps / LLM cost.
# 2026-09-22: raised 1000 → 2500 (1000 steps ≈ 80-100 LLM rounds with the
# middleware chain, too tight for tool-intensive long tasks).
max_recursion_limit: 2500

# ============================================================================
# Slow LLM Call Observability (2026-09-22)
# ============================================================================
# A model call slower than this emits logger.warning + an `llm_slow` stream
# event and is counted into the run row's slow_llm_call_count. Surfaces
# provider-side silent-retry stalls (e.g. 180s request_timeout retries) that
# otherwise leave no trace in logs or run events.
slow_llm_warn_seconds: 90

# ============================================================================
# Empty-Response Governance（OBS-02，2026-09-23 批 1 A2/A3）
# ============================================================================
# 真实用户触发的 run 出现空终态 AIMessage 时的自动重试：预算内指数冷却
# （仅异步生产路径），第 2 次重试起在推理窗口内轻量截断中段工具输出
# （零 state 写，checkpoint 原文不动）。耗尽后落中文兜底 + llm_empty_fallback
# 流事件 + run 行 empty_fallback_count 计数。回滚 = max_retries 调回 1。
empty_response_max_retries: 3
empty_response_cooldown_base_seconds: 2.0
empty_response_cooldown_max_seconds: 8.0
empty_response_trim_on_retry: true

# ============================================================================
# Sandbox Circuit Breaker（DEF-04 C1，2026-09-23 批 1）
# ============================================================================
# 连续 N 次工具结果携带 [SANDBOX_DEAD] 标记（容器不存在/连接拒绝/daemon 失联
# ——源头 aio_sandbox 打标，正常非零退出天然豁免）→ 熔断终止本次 run：
# error 态 + 中文文案 + checkpoint 保留（回复「继续」续作）。回滚 = 阈值调大。
sandbox_failure_circuit_breaker_threshold: 5

# ============================================================================
# Disk Admission（DEF-04 C2，2026-09-23 批 1）
# ============================================================================
# run 启动 + 沙箱创建双检查点的磁盘准入，一次 shutil.disk_usage 微秒级探测。
# 模式差异：docker/aio 沙箱模式强制拦截（渲染负载在容器侧）；local sandbox
# 模式降级为 WARN 日志（本地开发无渲染负载、磁盘自管）。
# 生产默认 5 GiB（渲染帧缓存余量）；测试机（64G 小盘）在自己 config.yaml
# 覆盖为 2 GiB（2147483648）。余量 < warn 比例仅 WARNING，不拦截。
disk_min_free_bytes_block: 5368709120   # 5 GiB
disk_warn_free_ratio: 0.15

# ============================================================================
# Token Budget Warning（OBS-03 D3，2026-09-23 批 2）
# ============================================================================
# thread 累计 tokens（与 UI 徽章同口径）超过任务类型阈值 → Tokens 徽章变红 +
# token_budget_warn 后端事件；只告警不阻断。12M 定标：5 页 PPT≈8M 不告警、
# 33 页≈15M 为 80% 分位（第三轮由 5M 上调）；观察期后按分位数据校准。
token_budget_warn_tokens:
  default: 12000000
  ppt-master: 12000000
  course-video: 12000000

# ============================================================================
# Token Budget（2026-08-13 D7/T18 移植）
# ============================================================================
# 每 run token 预算熔断。出厂保持 enabled: false；公司服务器建议启用：
# 2026-10-14 ppt-master 事故消耗 25M token 仍未交付，证明失控形态需要机械熔断。
# 交付优先阈值（2026-10-15 拍板）：max_tokens=30000000、max_input_tokens=null
# （本事故输入占大头，单独输入上限留 6M 会先误伤可交付长任务）；warn_threshold
# 0.6 默认 → 18M 注入 wrap-up 提示，hard_stop 在 30M 拦真失控。
# 注意：下方出厂值 8M/6M 为旧校准，非本批拍板阈值；公司服务器启用前须按部署
# 手册 K17.5 覆盖为 max_tokens=30000000、max_input_tokens=null。
token_budget:
  enabled: false
  max_tokens: 8000000        # 8M（近期成功 max 7.6M × 1.05）
  max_input_tokens: 6000000  # 6M（输入爆炸形态二级防线）
  warn_threshold: 0.6        # 4.8M 注入 wrap-up 提示
  hard_stop_threshold: 1.0

# ============================================================================
# Logging
# ============================================================================
# Log level for deerflow modules (debug/info/warning/error)
log_level: info

# ============================================================================
# Token Usage
# ============================================================================
# Enable token usage collection and display.
# When enabled, DeerFlow records input/output/total tokens per model call
# and shows usage metadata in the workspace UI when providers return it.
token_usage:
  enabled: true
  # Per-run cumulative token count above which a run is logged and flagged in
  # the operations console (/console). 0 disables the flag.
  #
  # Recording ONLY. Unlike upstream's token_budget_middleware this never warns
  # the model, never strips tool_calls, and never ends a run early — long
  # video-generation runs would otherwise be nudged into cutting their
  # storyboards short, which looks like success but ships a worse video.
  #
  # The default (7,500,000) is the p95 of this deployment's 869 real runs
  # measured 2026-08-03: median 121,182 / p95 7,462,994 / p99 29,634,502 /
  # max 256,517,593. Upstream's 200,000 default would flag 387 of those runs,
  # 370 of which succeeded. Re-measure before changing it.
  attention_threshold_tokens: 7500000

# ============================================================================
# Models Configuration
# ============================================================================
# Configure available LLM models for the agent to use
#
# Cost reporting (optional): annotate any model with a `pricing` block and the
# operations console will estimate spend per run / per day / per model.
# ModelConfig allows extra fields, so no schema change is needed.
#
#   pricing:
#     currency: CNY                     # must match across ALL models —
#                                       #   mixed currencies disable cost
#                                       #   reporting entirely
#     input_per_million: 8              # input (cache-miss) price
#     output_per_million: 32            # output price
#     input_cache_hit_per_million: 0.8  # optional; omit to bill cache hits
#                                       #   at the full input price
#
# A model with no pricing block (or with input/output both <= 0) is treated as
# unpriced: the console reports its cost as null rather than inventing a value.

